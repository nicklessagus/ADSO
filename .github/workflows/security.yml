name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Mondays at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit

      # Las tres CVEs ignoradas son del **modo servidor** de ChromaDB y no son
      # alcanzables acá: ADSO usa `PersistentClient` embebido (sqlite local, ver
      # `adso/embeddings.py`), no expone puertos (`docker-compose.yml`) y no hay
      # tenants, proveedor de auth ni API HTTP en el repo. Ninguna tiene versión
      # con fix publicada, así que el pin no se puede mover.
      #
      #   CVE-2026-45830  bypass de autorización entre tenants (requiere servidor)
      #   CVE-2026-45831  SimpleRBACAuthorizationProvider ignora el scope del permiso
      #   CVE-2026-45833  code injection vía POST /api/v2/.../collections/{id}
      #                   con trust_remote_code (requiere la API REST)
      #
      # REVISAR cuando salga un chromadb con fix: sacar los --ignore-vuln y
      # bumpear el pin. Si aparece una CVE nueva, este flag NO la tapa: la
      # supresión es por ID, a propósito.
      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt --format=markdown \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833

  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history for secret scanning

      - name: TruffleHog scan
        # Pineado a commit SHA (v3.95.8): una action third-party flotante a @main
        # ejecutaría código arbitrario en el runner si su repo se compromete.
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  codeql:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
