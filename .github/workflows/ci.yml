name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Corre la suite COMPLETA (unit + integration + e2e). Ningún test toca la
      # red: integration usa filesystem temporal y e2e simula updates de
      # Telegram con mocks. Antes había un `-m "not integration and not e2e"`
      # que no excluía nada porque los markers no estaban aplicados a ningún
      # test; ahora que sí lo están (hook en tests/conftest.py), ese filtro
      # sacaría 193 tests de CI. Ver G15 en docs/audit-2026-07-31.md.
      - name: Run tests
        run: pytest --cov=adso --cov-report=xml --no-cov-on-fail
        env:
          TELEGRAM_TOKEN: dummy
          TELEGRAM_ALLOWED_USER_ID: "12345"
          GEMINI_API_KEY: dummy
          VAULT_PATH: /tmp/adso_test_vault

      # El gate mide el código real, `adso/handlers/*` incluido (~40% del
      # proyecto, antes omitido). Actual: 74%. El umbral queda en 70 para dar
      # margen a variaciones menores; subirlo es la forma de fijar el terreno
      # ganado a medida que la regla test-first suma cobertura.
      - name: Check coverage threshold (3.11 only)
        if: matrix.python-version == '3.11'
        run: python -m coverage report --fail-under=70

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        # ruff pineado a la serie 0.15: la 0.16.0 cambió las reglas default
        # (isort etc.) y rompe con ~312 hallazgos nuevos. Adoptarla es tarea aparte.
        run: pip install "ruff~=0.15.10" mypy types-PyYAML

      - name: ruff check
        run: ruff check adso/ tests/

      - name: mypy
        run: mypy adso/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # treat as advisory until type coverage is complete

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build --no-cache -t adso:ci .

      - name: Check image size
        run: |
          SIZE=$(docker image inspect adso:ci --format='{{.Size}}')
          echo "Image size: $(( SIZE / 1024 / 1024 )) MB"
          # Fail if image exceeds 2GB (generous limit for RPi deployment)
          [ "$SIZE" -lt 2147483648 ] || (echo "Image too large" && exit 1)
