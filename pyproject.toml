[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adso"
dynamic = ["version"]
description = "Autonomous Data Structuring Orchestrator — Telegram bot for Obsidian vault management"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot[job-queue]~=21.10",
    "google-genai>=1.0,<2",
    "groq>=0.9,<2",
    "python-frontmatter~=1.1",
    "python-slugify~=8.0",
    "pyyaml~=6.0",
    "gitpython~=3.1",
    "chromadb~=0.5",
    "faster-whisper>=1.0,<2",
    "pymupdf>=1.23,<2",
    "pytesseract>=0.3,<1",
    "Pillow>=10.0,<13",
    "google-api-python-client>=2.100,<3",
    "google-auth-oauthlib>=1.0,<2",
    "watchdog~=4.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=6.0",
    "ruff~=0.15.10",
]

[tool.setuptools.dynamic]
version = {attr = "adso.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["adso*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests (filesystem, mocked APIs)",
    "e2e: end-to-end tests (simulated Telegram updates)",
]

[tool.coverage.run]
source = ["adso"]
omit = [
    "adso/__main__.py",
    "adso/bot.py",          # e2e territory — requires PTB Application setup
    "adso/handlers/*",      # e2e territory — require Update/Context from PTB
]

[tool.coverage.report]
show_missing = true
# fail_under aplicado solo en Python 3.11 via CI (ver .github/workflows/ci.yml)
