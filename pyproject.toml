[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adso"
version = "0.1.0"
description = "Autonomous Data Structuring Orchestrator — Telegram bot for Obsidian vault management"
requires-python = ">=3.9"
dependencies = [
    "python-telegram-bot~=21.10",
    "google-genai>=1.0",
    "python-frontmatter~=1.1",
    "python-slugify~=8.0",
    "pyyaml~=6.0",
    "gitpython~=3.1",
    "chromadb~=0.5",
    "faster-whisper>=1.0",
    "pymupdf>=1.23",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3",
    "pytest-asyncio~=0.24",
    "pytest-cov~=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: integration tests (filesystem, mocked APIs)",
    "e2e: end-to-end tests (simulated Telegram updates)",
]

[tool.coverage.run]
source = ["adso"]
omit = ["adso/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
