services:
  adso-bot:
    build: .
    container_name: adso-bot
    restart: unless-stopped
    user: "${ADSO_UID:-1000}:${ADSO_GID:-1000}"
    env_file:
      - .env
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
      - ${GOOGLE_CALENDAR_CREDS:-./credentials}:/credentials
      - adso-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - VAULT_PATH=/vault
      - CONFIG_PATH=/app/config.yaml
      - ANONYMIZED_TELEMETRY=false
      - HF_HOME=/app/data/hf_cache
      - GOOGLE_CALENDAR_CREDS=/credentials/google-oauth.json
    healthcheck:
      test: ["CMD", "find", "/tmp/adso_heartbeat", "-mmin", "-2"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  adso-data:
