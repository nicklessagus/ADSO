services:
  adso-bot:
    build: .
    container_name: adso-bot
    restart: unless-stopped
    user: "${ADSO_UID:-1000}:${ADSO_GID:-1000}"
    # Hardening: el bot procesa archivos no confiables (PDFs, imágenes) con
    # pymupdf/Pillow/tesseract — reducir superficie ante una vuln en esas libs.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - .env
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
      - ${GOOGLE_CALENDAR_CREDS:-./credentials}:/credentials
      - adso-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - TZ=America/Argentina/Buenos_Aires
      - VAULT_PATH=/vault
      - ANONYMIZED_TELEMETRY=false
      - HF_HOME=/app/data/hf_cache
      - GOOGLE_CALENDAR_CREDS=/credentials/google-oauth.json
    healthcheck:
      # `find` sale 0 aunque no matchee nada: sin el `test -n` un heartbeat
      # congelado nunca se marcaba unhealthy. `$$` escapa la interpolación de compose.
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/adso_heartbeat -mmin -2)\""]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  adso-data:
