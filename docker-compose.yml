services:
  adso-bot:
    build: .
    container_name: adso-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${VAULT_PATH:-./vault}:/vault
      - ${GOOGLE_CALENDAR_CREDS:-./credentials}:/credentials
      - adso-data:/app/data
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - VAULT_PATH=/vault
      - CONFIG_PATH=/app/config.yaml
      - ANONYMIZED_TELEMETRY=false

volumes:
  adso-data:
